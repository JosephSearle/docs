name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One install, then each script in order: ESLint, Biome format check, types, Vitest.
  ci:
    name: lint, format, typecheck, test
    uses: JosephSearle/workflow-catalog/.github/workflows/node-ci.yml@52dc33b701540a49cfc36f03ac93a779631441af # v1.0.0
    permissions:
      contents: read
    with:
      scripts: lint format:check typecheck test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: next-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - run: pip install detect-secrets
      - name: Scan for new/unaudited secrets
        run: |
          detect-secrets scan \
            --exclude-files '\.next/' \
            --exclude-files 'node_modules/' \
            --exclude-files 'package-lock\.json' \
            --baseline .secrets.baseline
          # `scan` always rewrites generated_at, so ignore that field when
          # deciding whether the results actually changed.
          jq 'del(.generated_at)' .secrets.baseline > /tmp/after.json
          git show HEAD:.secrets.baseline | jq 'del(.generated_at)' > /tmp/before.json
          diff /tmp/before.json /tmp/after.json

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: next-build
          path: .next
      - name: Start server
        run: npx next start &
      - name: Wait for server
        run: npx wait-on http://localhost:3000
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress "http://localhost:3000"
          fail: true

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
